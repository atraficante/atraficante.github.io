<html>
<head>
    <title>Adobe Acrobat Services PDF Embed API Sample</title>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1"/>
</head>
<body style="margin: 0px">
<div id="adobe-dc-view"></div>
<div id="adobe-dc-view"></div>
<script src="https://acrobatservices.adobe.com/view-sdk/viewer.js"></script>
<script type="text/javascript">
    document.addEventListener("adobe_dc_view_sdk.ready", function(){
        var adobeDCView = new AdobeDC.View({clientId: "cf57730b79904460980e2b05be4bcd9c", divId: "adobe-dc-view"});
        adobeDCView.previewFile({
            content:{location: {url: location.hash.replace(/#/, "")}},
            metaData:{fileName: location.hash.replace(/#/, "").substring(8)}
        }, {defaultViewMode: "FIT_PAGE"});
    });
</script>
</script>
</body>
